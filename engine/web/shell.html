<!doctype html>
<!-- Engine page shell (emcc --shell-file). build.sh replaces @TITLE@ with the target's MANIFEST title. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #07070c; overflow: hidden; overscroll-behavior: none;
               touch-action: none; user-select: none; -webkit-user-select: none; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  .veil { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 18px; padding: 16px; box-sizing: border-box; text-align: center;
          background: radial-gradient(ellipse at 50% 45%, #1a0f1f 0%, #07070c 70%);
          color: #9fb4d0; font: 13px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; letter-spacing: .12em; }
  .logo { font: italic 900 clamp(34px, 9vw, 96px)/1 system-ui, "Segoe UI", Arial, sans-serif; letter-spacing: .04em;
          color: #fff; text-shadow: 3px 3px 0 #000; white-space: nowrap; position: relative; }
  .logo::after { content: ""; position: absolute; left: -4%; right: -4%; top: 52%; height: 3px; background: #ff1e3c;
                 transform: rotate(-6deg); box-shadow: 0 0 12px #ff1e3c; opacity: .9; }
  .bar { width: min(420px, 80vw); height: 3px; background: #1d1a26; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #ff1e3c; box-shadow: 0 0 10px #ff1e3c; transition: width .15s; }
  #err { display: none; z-index: 2; }
  #err h2 { margin: 0; color: #ff1e3c; font: 900 22px/1.2 system-ui, Arial, sans-serif; letter-spacing: .08em; }
  #err p { max-width: 560px; margin: 0; color: #c9c3d6; letter-spacing: .02em; word-break: break-word; }
  #err button { font: inherit; letter-spacing: .15em; color: #fff; background: #9e0f1c; border: 0; padding: 8px 18px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="load" class="veil">
  <div class="logo">@TITLE@</div>
  <div class="bar"><i id="fill"></i></div>
  <div id="stage">DOWNLOADING</div>
</div>
<div id="err" class="veil"><h2 id="errh">SOMETHING BROKE</h2><p id="errp"></p><button onclick="location.reload()">RELOAD</button></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var canvas = $('canvas'), shown = false;
  function progress(f, label) { $('fill').style.width = Math.round(Math.max(0, Math.min(1, f)) * 100) + '%'; if (label) $('stage').textContent = label; }
  function fatal(title, msg) {
    if (shown) return; shown = true;            // keep the first (root-cause) message
    $('load').style.display = 'none'; $('errh').textContent = title; $('errp').textContent = msg || ''; $('err').style.display = 'flex';
  }
  var NO_GPU = 'This page renders with WebGPU. Use a current Chrome or Edge (113+), Safari 26+, or Firefox 141+ on Windows, with hardware acceleration enabled.';
  // SDL_GPU's WebGPU backend imports a device requested here, before main(): requesting one from wasm
  // would have to block (ASYNCIFY/JSPI), which the ECL runtime can't use. All adapter features are
  // requested because SDL checks for the ones it needs.
  // high-performance first: some setups (e.g. Linux + NVIDIA) return no adapter for the default request.
  var gpu = navigator.gpu ? navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }).then(function (a) {
    return a || navigator.gpu.requestAdapter();
  }).then(function (a) {
    return a && a.requestDevice({ requiredFeatures: Array.from(a.features) }).then(function (d) { return { a: a, d: d }; });
  }).catch(function (e) { console.error('WebGPU: ' + e); return null; }) : Promise.resolve(null);

  // wasm download with byte progress (0-60 %), then compile (60-70 %), then Lisp startup steps (70-100 %)
  var wasmBytes = navigator.gpu ? fetch('index.wasm').then(function (r) {
    if (!r.ok) throw new Error('index.wasm: HTTP ' + r.status);
    var total = +r.headers.get('content-length') || 0;
    if (!r.body || !total) return r.arrayBuffer();
    var reader = r.body.getReader(), got = 0, parts = [];
    return (function pump() {
      return reader.read().then(function (c) {
        if (c.done) return new Blob(parts).arrayBuffer();
        parts.push(c.value); got += c.value.length; progress(0.6 * got / total, 'DOWNLOADING ' + Math.round(100 * got / total) + '%');
        return pump();
      });
    })();
  }) : null;

  window.Module = {
    canvas: canvas,
    printErr: function (t) { console.warn(t); },
    preRun: [function () {
      Module.addRunDependency('webgpu');
      gpu.then(function (g) {
        if (!g) { fatal('WEBGPU UNAVAILABLE', NO_GPU); return; }   // never start
        g.d.onuncapturederror = function (e) { console.error('WebGPU: ' + e.error.message); };
        g.d.lost.then(function (info) {
          if (info.reason !== 'destroyed') fatal('GRAPHICS DEVICE LOST', 'The GPU reset or ran out of memory (' + (info.message || info.reason) + '). Reload the page to continue.');
        });
        Module.preinitializedWebGPUAdapter = g.a; Module.preinitializedWebGPUDevice = g.d;
        Module.removeRunDependency('webgpu');
      });
    }],
    instantiateWasm: function (imports, done) {
      if (!wasmBytes) return {};                 // no WebGPU: never start (the error veil is up)
      wasmBytes.then(function (b) { progress(0.6, 'COMPILING'); return WebAssembly.instantiate(b, imports); })
        .then(function (r) { progress(0.7, 'STARTING'); done(r.instance, r.module); })
        .catch(function (e) { fatal('COULD NOT LOAD', String(e && e.message || e)); });
      return {};
    },
    engineLoading: function (pct) {              // called by the engine's startup steps (app.lisp)
      progress(0.7 + 0.003 * pct);
      if (pct >= 100) $('load').style.display = 'none';
    },
    engineFatal: function (msg) { fatal('THE GAME STOPPED', msg + ' — reload to try again.'); },
    onAbort: function (w) { fatal('THE GAME CRASHED', String(w)); }
  };
  if (!navigator.gpu) fatal('WEBGPU UNAVAILABLE', NO_GPU);

  canvas.addEventListener('pointerdown', function () { canvas.focus(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {   // keep the page still: no scrolling / tab-out / find
    if ([' ', 'Spacebar', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', 'Tab', 'Backspace', "'", '/'].indexOf(e.key) >= 0) e.preventDefault();
  }, true);
  window.addEventListener('wheel', function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener('error', function (e) { if (e.message && /abort|RuntimeError/i.test(e.message)) fatal('THE GAME CRASHED', e.message); });
})();
</script>
{{{ SCRIPT }}}
</body>
</html>
